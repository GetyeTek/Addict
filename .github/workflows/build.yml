name: Build DNS Guard Signed APK

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Manual Sign APK
        run: |
          # 1. Debug Secret Integrity
          RAW_SECRET="${{ secrets.SIGNING_KEY }}"
          echo "Secret Length: ${#RAW_SECRET} characters"
          echo "Start of Secret: ${RAW_SECRET:0:10}..."
          echo "End of Secret: ...${RAW_SECRET: -10}"

          # 2. Decode
          echo "$RAW_SECRET" | base64 -di > app/release.jks
          
          # Check file size
          FILE_SIZE=$(wc -c < app/release.jks)
          echo "Decoded Keystore Size: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 2000 ]; then
            echo "ERROR: Keystore size mismatch. Expected ~2724, got $FILE_SIZE."
            exit 1
          fi

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: dns-guard-v2-stable
          path: app/build/outputs/apk/release/dns-guard-v2-stable.apk
